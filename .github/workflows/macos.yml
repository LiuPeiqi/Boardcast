name: Optional macOS local-build check
# Local Xcode development does not depend on this workflow. Run only by explicit dispatch.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    defaults:
      run:
        working-directory: platforms/macos
    steps:
      - uses: actions/checkout@v4
      - name: Test and build the universal development app
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Boardcast-macOS-local-development
          path: artifacts/macos/local/**/*.zip
          if-no-files-found: error
